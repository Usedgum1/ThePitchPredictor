<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>pitchIQ | Pitcher Lookup</title>
  <meta name="description" content="Mobile pitcher lookup for pitchIQ strikeout prop research." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/x-icon" href="./images/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="./images/favicon/site.webmanifest" />

  <style>
    :root {
      --bg: #050505;
      --surface: rgba(12, 14, 20, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f0e8;
      --muted: #a7afbc;
      --violet: #8d8aff;
      --amber: #ff942e;
      --blue: #6bb6ff;
      --success: #8ddf9f;
      --neon-blue: #2f9bff;
      --neon-gold: #ffd84f;
      --neon-red: #ff174d;
      --danger: #ff8c7a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --toolbar-pill-height: 40px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background:
        radial-gradient(circle at 12% 14%, rgba(141, 138, 255, 0.2), transparent 22%),
        radial-gradient(circle at 86% 10%, rgba(255, 148, 46, 0.18), transparent 20%),
        radial-gradient(circle at 62% 28%, rgba(107, 182, 255, 0.14), transparent 18%),
        linear-gradient(180deg, #050505 0%, #090a10 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    button, input { font: inherit; }

    .hidden { display: none !important; }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 0 14px calc(18px + var(--safe-bottom));
    }

    .header {
      position: fixed;
      top: 0;
      left: 50%;
      z-index: 20;
      width: 100%;
      max-width: 520px;
      padding: calc(10px + var(--safe-top)) 14px 12px;
      background: #090a10;
      border-bottom: 1px solid var(--line);
      box-sizing: border-box;
      transform: translateX(-50%) translateZ(0);
      -webkit-transform: translateX(-50%) translateZ(0);
    }

    .header-spacer {
      height: var(--mobile-header-height, 132px);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--amber);
      line-height: 1.1;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-account {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .account-line {
      margin: 0;
      min-width: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.2;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-username { font-weight: 800; }

    .tier-value-basic { color: var(--neon-blue); }
    .tier-value-pro { color: var(--amber); }
    .tier-value-life { color: var(--neon-gold); }
    .tier-value-admin { color: var(--violet); }
    .tier-value-owner { color: var(--neon-red); }

    .nav-menu { position: relative; }

    .nav-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--toolbar-pill-height);
      height: var(--toolbar-pill-height);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--violet);
      cursor: pointer;
    }

    .nav-toggle-icon {
      display: block;
      width: 16px;
      height: 12px;
      position: relative;
    }

    .nav-toggle-icon::before,
    .nav-toggle-icon::after,
    .nav-toggle-icon > span {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .nav-toggle-icon::before { content: ""; top: 0; }
    .nav-toggle-icon > span { top: 5px; }
    .nav-toggle-icon::after { content: ""; bottom: 0; }

    .nav-toggle[aria-expanded="true"] {
      border-color: rgba(141, 138, 255, 0.45);
      background: rgba(141, 138, 255, 0.1);
      color: var(--text);
    }

    .nav-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 30;
      min-width: 192px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(10, 11, 17, 0.98);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .nav-dropdown a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    .nav-dropdown a:hover,
    .nav-dropdown a:active,
    .nav-dropdown a.is-active {
      background: rgba(141, 138, 255, 0.12);
      color: var(--violet);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-shell {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .favorite-pitcher-btn {
      width: var(--toolbar-pill-height);
      height: var(--toolbar-pill-height);
      padding: 0;
      border: 1px solid rgba(255, 215, 79, 0.28);
      border-radius: 10px;
      background: rgba(255, 215, 79, 0.1);
      color: #ffd84f;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .favorite-pitcher-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .favorite-pitcher-btn.is-favorited {
      border-color: rgba(255, 215, 79, 0.55);
      background: rgba(255, 215, 79, 0.2);
      box-shadow: 0 0 12px rgba(255, 215, 79, 0.22);
    }

    .favorite-pitcher-btn.is-locked {
      border-color: rgba(255, 148, 46, 0.28);
      background: rgba(255, 148, 46, 0.08);
      color: var(--amber);
    }

    .favorite-pitcher-btn svg {
      width: 18px;
      height: 18px;
      display: block;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      min-height: var(--toolbar-pill-height);
      padding: 0 36px 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
    }

    .search-input::placeholder { color: var(--muted); }

    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 25;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(10, 11, 17, 0.98);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      -webkit-overflow-scrolling: touch;
    }

    .search-option,
    .search-empty {
      padding: 12px 14px;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .search-option {
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .search-option:last-child { border-bottom: 0; }

    .search-option.active,
    .search-option:active {
      background: rgba(141, 138, 255, 0.12);
      color: var(--violet);
    }

    .search-empty { color: var(--muted); }

    .lookup-panel {
      display: grid;
      gap: 14px;
    }

    .lookup-empty {
      padding: 48px 20px;
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
    }

    .lookup-empty-title {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
    }

    .lookup-empty-body {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .result-hero {
      padding: 18px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
    }

    .result-hero.is-live {
      border-color: rgba(141, 214, 159, 0.24);
      background: linear-gradient(180deg, rgba(141, 214, 159, 0.1), rgba(141, 214, 159, 0.03));
    }

    .result-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .result-pitcher {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.15;
      color: var(--text);
      min-width: 0;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-badge.is-live {
      color: var(--success);
      background: rgba(141, 214, 159, 0.12);
      border-color: rgba(141, 214, 159, 0.24);
    }

    .status-badge.is-upcoming {
      color: var(--amber);
      background: rgba(255, 148, 46, 0.1);
      border-color: rgba(255, 148, 46, 0.22);
    }

    .result-meta {
      display: grid;
      gap: 4px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .result-meta li {
      font-size: 0.84rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .result-meta li.is-live {
      color: var(--success);
      font-weight: 700;
    }

    .result-block {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.14);
    }

    .result-block.is-matchup.is-live {
      border-color: rgba(141, 214, 159, 0.24);
      background: linear-gradient(180deg, rgba(141, 214, 159, 0.1), rgba(141, 214, 159, 0.03));
    }

    .result-block.is-matchup.is-live .result-block-title {
      color: var(--success);
    }

    .result-block-title {
      margin: 0 0 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .matchup-datetime {
      margin: 0 0 10px;
      font-size: 0.84rem;
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
    }

    .matchup-datetime.is-live {
      color: var(--success);
      font-weight: 700;
    }

    .matchup-live-label {
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .matchup-live-sep,
    .matchup-live-status {
      font-weight: 700;
      letter-spacing: normal;
      text-transform: none;
    }

    .matchup-strip {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: start;
    }

    .matchup-col {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .matchup-col.pitcher {
      text-align: left;
    }

    .matchup-col.opponent {
      text-align: right;
    }

    .matchup-team {
      min-width: 0;
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.3;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .matchup-col.opponent .matchup-team {
      color: #c8d0dc;
    }

    .matchup-sub {
      font-size: 0.76rem;
      line-height: 1.35;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .matchup-vs {
      align-self: center;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .book-rows {
      display: grid;
      gap: 8px;
    }

    .book-row {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .book-row.is-dk { border-color: rgba(141, 214, 159, 0.14); }
    .book-row.is-fd { border-color: rgba(107, 182, 255, 0.14); }
    .book-row.is-pitchiq {
      border-color: rgba(255, 148, 46, 0.24);
      background: rgba(255, 148, 46, 0.08);
    }

    .book-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .book-name {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .book-row.is-dk .book-name { color: var(--success); }
    .book-row.is-fd .book-name { color: var(--blue); }
    .book-row.is-pitchiq .book-name { color: var(--amber); }

    .book-line {
      font-size: 1.05rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .book-row.is-pitchiq .book-line { color: var(--amber); }

    .book-row-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .book-bet {
      font-weight: 700;
      color: var(--text);
    }

    .book-bet.is-over { color: var(--success); }
    .book-bet.is-under { color: var(--danger); }
    .book-bet.is-avoid { color: var(--muted); }

    .book-edge {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .book-edge.positive { color: var(--success); }
    .book-edge.negative { color: var(--danger); }
    .book-edge.neutral { color: var(--muted); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .stat-pill {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-width: 0;
    }

    .stat-pill.span-2 { grid-column: 1 / -1; }

    .stat-pill .label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat-pill .value {
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.3;
      color: var(--text);
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .stat-pill.is-assigned .value { color: var(--text); }
    .stat-pill.is-pending .value { color: var(--muted); }
    .stat-pill.is-live .label { color: var(--success); }
    .stat-pill.is-vix .label { color: var(--neon-blue); }

    .note-list {
      display: grid;
      gap: 8px;
    }

    .note-card {
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(28, 30, 38, 0.88), rgba(15, 17, 24, 0.88));
    }

    .note-card.up {
      border-color: rgba(255, 148, 46, 0.58);
      background: linear-gradient(180deg, rgba(52, 28, 6, 0.92), rgba(24, 15, 8, 0.92));
      box-shadow: inset 0 1px 0 rgba(255, 148, 46, 0.18);
    }

    .note-card.down {
      border-color: rgba(107, 182, 255, 0.58);
      background: linear-gradient(180deg, rgba(8, 22, 48, 0.92), rgba(8, 14, 28, 0.92));
      box-shadow: inset 0 1px 0 rgba(107, 182, 255, 0.16);
    }

    .note-card.neutral {
      border-color: rgba(167, 175, 188, 0.34);
      background: linear-gradient(180deg, rgba(28, 30, 38, 0.88), rgba(15, 17, 24, 0.88));
      box-shadow: inset 0 1px 0 rgba(167, 175, 188, 0.12);
    }

    .note-title {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .note-k {
      color: var(--amber);
      margin-left: 6px;
    }

    .note-k.down {
      color: var(--blue);
    }

    .note-body {
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .note-card.up .note-body strong {
      color: var(--blue);
      font-weight: 950;
    }

    .note-card.down .note-body strong {
      color: var(--amber);
      font-weight: 950;
    }

    .note-body strong.note-book-dk {
      color: #5cff77;
      font-weight: 950;
    }

    .note-body strong.note-book-fd {
      color: var(--blue);
      font-weight: 950;
    }

    .loading-shell {
      display: grid;
      gap: 10px;
      padding: 8px 0;
    }

    .skeleton-row {
      height: 72px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      background-size: 200% 100%;
      animation: shimmer 1.2s ease infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    .footer {
      margin-top: 14px;
      padding-top: 4px;
      text-align: center;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #39ff14;
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.35);
    }

    .pitchiq-confirm-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 4, 8, 0.78);
      backdrop-filter: blur(4px);
    }

    .pitchiq-confirm-modal.hidden {
      display: none !important;
    }

    body.pitchiq-modal-open {
      overflow: hidden;
    }

    .pitchiq-confirm-card {
      width: min(480px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(18, 20, 28, 0.98), rgba(11, 12, 18, 0.98));
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.42);
      padding: 22px;
    }

    .pitchiq-confirm-card.add { border-color: rgba(255, 148, 46, 0.28); }
    .pitchiq-confirm-card.remove { border-color: rgba(255, 23, 77, 0.28); }

    .pitchiq-confirm-title {
      margin: 0 0 12px;
      font-size: 1.08rem;
      text-align: center;
    }

    .pitchiq-confirm-title.add { color: var(--amber); }
    .pitchiq-confirm-title.remove { color: var(--neon-red); }

    .pitchiq-confirm-copy {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.65;
      text-align: center;
    }

    .pitchiq-confirm-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pitchiq-confirm-actions .button {
      min-width: 112px;
      border-radius: 12px;
      border: 1px solid rgba(141, 138, 255, 0.24);
      background: linear-gradient(180deg, rgba(24, 26, 38, 0.96), rgba(18, 19, 28, 0.96));
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
    }

    .pitchiq-confirm-actions .button.cancel {
      border-color: rgba(255, 23, 77, 0.58);
      background: rgba(255, 23, 77, 0.14);
      color: var(--neon-red);
    }

    .pitchiq-confirm-actions .button.proceed.add {
      border-color: rgba(255, 148, 46, 0.58);
      background: rgba(255, 148, 46, 0.14);
      color: var(--amber);
    }

    .pitchiq-confirm-actions .button.proceed.remove {
      border-color: rgba(255, 23, 77, 0.58);
      background: rgba(255, 23, 77, 0.14);
      color: var(--neon-red);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="brand-block">

  <script>
    (function () {
      const CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
      const LOCAL = "./vendor/supabase.js";
      function getLib() {
        if (window.supabase?.createClient) return window.supabase;
        try {
          if (typeof supabase !== "undefined" && supabase?.createClient) {
            window.supabase = supabase;
            return supabase;
          }
        } catch {}
        return null;
      }
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = false;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(`Failed to load ${src}`));
          document.head.appendChild(script);
        });
      }
      window.pitchiqLoadSupabase = function pitchiqLoadSupabase() {
        const ready = getLib();
        if (ready) return Promise.resolve(ready);
        if (!window.__pitchiqSupabaseLoadPromise) {
          window.__pitchiqSupabaseLoadPromise = (async () => {
            for (const src of [CDN, LOCAL]) {
              try { await loadScript(src); } catch { continue; }
              const lib = getLib();
              if (lib) return lib;
            }
            throw new Error("Supabase library failed to load");
          })();
        }
        return window.__pitchiqSupabaseLoadPromise;
      };
    })();
  </script>

  <script>
    (async () => {
      try {
        await window.pitchiqLoadSupabase();

        window.location.replace("./login.html");
        return;
      }

      const SUPABASE_URL = "https://odvopvoqssamjquinhft.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7g1yX__kNzT-6tj8Tr4SIg_T4BX9BlV";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          autoRefreshToken: true,
          detectSessionInUrl: true,
          persistSession: true,
          storage: window.localStorage,

      });

      const ALLOWED_ACCOUNT_ROLES = ["basic", "pro", "life", "admin", "owner"];
      const LIVE_GAME_MAX_MINUTES = 18 * 60;
      const GAME_BOARD_CACHE_TTL_MS = 12 * 60 * 60 * 1000;

      const accountPill = document.getElementById("account-pill");
      const header = document.querySelector(".header");

      const lookupPanel = document.getElementById("lookup-panel");

      const serverActivityFooter = document.getElementById("server-activity-footer");
      const navMenu = document.getElementById("nav-menu");
      const navToggle = document.getElementById("nav-toggle");
      const navDropdown = document.getElementById("nav-dropdown");
      const lookupFavoriteBtn = document.getElementById("lookup-favorite-btn");
      const pitchiqConfirmModal = document.getElementById("pitchiq-confirm-modal");
      const pitchiqConfirmCard = document.getElementById("pitchiq-confirm-card");
      const pitchiqConfirmTitle = document.getElementById("pitchiq-confirm-title");
      const pitchiqConfirmCopy = document.getElementById("pitchiq-confirm-copy");
      const pitchiqConfirmCancel = document.getElementById("pitchiq-confirm-cancel");
      const pitchiqConfirmProceed = document.getElementById("pitchiq-confirm-proceed");
      let pitchiqConfirmResolve = null;
      let pitchiqConfirmOpenedAt = 0;

      let authAccepted = false;
      let authRedirected = false;
      let authCheckId = 0;
      let currentUserId = null;
      let currentUserRole = null;
      let upcomingGames = [];
      let liveGames = [];
      let gameHistory = [];
      let lookupPitcherNames = [];
      let allPitchers = [];
      let favoritePitcherNames = [];
      let favoritePitcherKeys = new Set();
      let filteredPitchers = [];
      let activePitcherIndex = -1;
      let dataReady = false;

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeText(value) {
        return String(value || "").trim().toLowerCase();
      }

      function normalizePitcherKey(name) {
        return String(name || "").trim().toLowerCase();
      }

      function canonicalPitcherName(name) {
        const raw = String(name || "").trim();
        if (!raw) return "";
        const key = normalizePitcherKey(raw);
        return allPitchers.find((candidate) => normalizePitcherKey(candidate) === key) || raw;
      }

      function normalizeFavoritePitcherNames(names) {
        const unique = new Map();
        (names || []).forEach((name) => {
          const canonical = canonicalPitcherName(name);
          if (!canonical) return;
          unique.set(normalizePitcherKey(canonical), canonical);
        });
        return [...unique.values()];
      }

      function rebuildFavoritePitcherKeys() {
        favoritePitcherKeys = new Set(favoritePitcherNames.map((name) => normalizePitcherKey(name)).filter(Boolean));
      }

      function favoritePitcherStorageKey(userId = currentUserId) {
        return userId ? `pitchiq.favoritePitchers.${userId}` : "pitchiq.favoritePitchers";
      }

      function persistFavoritePitchersLocal() {
        if (!currentUserId) return;
        window.localStorage.setItem(favoritePitcherStorageKey(), JSON.stringify(favoritePitcherNames));
      }

      function loadFavoritePitchersLocal() {
        if (!currentUserId) {
          favoritePitcherNames = [];
          rebuildFavoritePitcherKeys();
          return;
        }
        try {
          const raw = window.localStorage.getItem(favoritePitcherStorageKey());
          const parsed = JSON.parse(raw || "[]");
          favoritePitcherNames = normalizeFavoritePitcherNames(Array.isArray(parsed) ? parsed : []);
          rebuildFavoritePitcherKeys();
        } catch {
          favoritePitcherNames = [];
          rebuildFavoritePitcherKeys();
        }
      }

      function canUseProFeatures() {
        return ["pro", "life", "admin", "owner"].includes(String(currentUserRole || "").toLowerCase());
      }

      function canViewMyPitchers() {
        return canUseProFeatures();
      }

      function isPitcherFavorited(name) {
        return favoritePitcherKeys.has(normalizePitcherKey(name));
      }

      function renderFavoriteStarIcon(favorited) {
        if (favorited) {
          return `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.86 5.8 6.4.93-4.63 4.52 1.09 6.38L12 17.77l-5.72 3.01 1.09-6.38L2.74 9.23l6.4-.93L12 2.5z"/></svg>`;
        }
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2.5l2.86 5.8 6.4.93-4.63 4.52 1.09 6.38L12 17.77l-5.72 3.01 1.09-6.38L2.74 9.23l6.4-.93L12 2.5z"/></svg>`;
      }

      function updateLookupFavoriteButton() {
        if (!lookupFavoriteBtn) return;
        if (!canViewMyPitchers()) {
          lookupFavoriteBtn.disabled = false;
          lookupFavoriteBtn.className = "favorite-pitcher-btn is-locked";
          lookupFavoriteBtn.innerHTML = "&#128274;";
          lookupFavoriteBtn.title = "My Pitchers is a Pro feature";
          lookupFavoriteBtn.setAttribute("aria-label", "My Pitchers is a Pro feature");
          return;
        }
        const pitcherName = resolvePitcherName();
        if (!pitcherName) {
          lookupFavoriteBtn.disabled = true;
          lookupFavoriteBtn.className = "favorite-pitcher-btn";
          lookupFavoriteBtn.innerHTML = renderFavoriteStarIcon(false);
          lookupFavoriteBtn.title = "Add to favorites";
          lookupFavoriteBtn.setAttribute("aria-label", "Add to favorites");
          lookupFavoriteBtn.setAttribute("aria-pressed", "false");
          return;
        }
        const favorited = isPitcherFavorited(pitcherName);
        lookupFavoriteBtn.disabled = false;
        lookupFavoriteBtn.className = `favorite-pitcher-btn${favorited ? " is-favorited" : ""}`;
        lookupFavoriteBtn.innerHTML = renderFavoriteStarIcon(favorited);
        const title = favorited ? "Remove from favorites" : "Add to favorites";
        lookupFavoriteBtn.title = title;
        lookupFavoriteBtn.setAttribute("aria-label", title);
        lookupFavoriteBtn.setAttribute("aria-pressed", favorited ? "true" : "false");
      }

      function closePitchiqConfirm(confirmed = false) {
        const resolve = pitchiqConfirmResolve;
        pitchiqConfirmResolve = null;
        pitchiqConfirmOpenedAt = 0;
        pitchiqConfirmModal.classList.add("hidden");
        pitchiqConfirmModal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("pitchiq-modal-open");
        if (resolve) resolve(confirmed);
      }

      function openPitchiqConfirm({ title, copy, tone, proceedLabel }) {
        return new Promise((resolve) => {
          pitchiqConfirmResolve = resolve;
          pitchiqConfirmOpenedAt = performance.now();
          pitchiqConfirmCard.className = `pitchiq-confirm-card ${tone}`;
          pitchiqConfirmTitle.className = `pitchiq-confirm-title ${tone}`;
          pitchiqConfirmTitle.textContent = title;
          pitchiqConfirmCopy.textContent = copy;
          pitchiqConfirmProceed.className = `button proceed ${tone}`;
          pitchiqConfirmProceed.textContent = proceedLabel;
          pitchiqConfirmModal.classList.remove("hidden");
          pitchiqConfirmModal.setAttribute("aria-hidden", "false");
          document.body.classList.add("pitchiq-modal-open");
          pitchiqConfirmCancel.focus();
        });
      }

      async function confirmFavoritePitcherChange(pitcherName, adding) {
        const label = String(pitcherName || "").trim() || "this pitcher";
        return openPitchiqConfirm({
          title: adding ? "Add to My Pitchers?" : "Remove from My Pitchers?",
          copy: adding
            ? `Add ${label} to your My Pitchers watchlist?`
            : `Remove ${label} from your My Pitchers watchlist?`,
          tone: adding ? "add" : "remove",
          proceedLabel: adding ? "Add" : "Remove",
        });
      }

      async function toggleFavoritePitcher(pitcherName) {
        if (!canViewMyPitchers() || !currentUserId || !pitcherName) return;
        const canonicalPitcher = canonicalPitcherName(pitcherName);
        const key = normalizePitcherKey(canonicalPitcher);
        const wasFavorited = favoritePitcherKeys.has(key);
        if (!(await confirmFavoritePitcherChange(canonicalPitcher, !wasFavorited))) {
          return;
        }
        if (wasFavorited) {
          favoritePitcherNames = favoritePitcherNames.filter((name) => normalizePitcherKey(name) !== key);
        } else {
          favoritePitcherNames = normalizeFavoritePitcherNames([...favoritePitcherNames, canonicalPitcher]);
        }
        rebuildFavoritePitcherKeys();
        persistFavoritePitchersLocal();
        updateLookupFavoriteButton();

        let error = null;
        if (wasFavorited) {
          ({ error } = await supabaseClient
            .from("pitchiq_favorite_pitchers")
            .delete()
            .eq("pitcher", canonicalPitcher));
        } else {
          ({ error } = await supabaseClient
            .from("pitchiq_favorite_pitchers")
            .insert({ user_id: currentUserId, pitcher: canonicalPitcher }));
        }
        if (error) {
          await loadFavoritePitchers();
          updateLookupFavoriteButton();
        }
      }

      async function loadFavoritePitchers() {
        if (!currentUserId || !canViewMyPitchers()) {
          favoritePitcherNames = [];
          rebuildFavoritePitcherKeys();
          updateLookupFavoriteButton();
          return;
        }
        const { data, error } = await supabaseClient
          .from("pitchiq_favorite_pitchers")
          .select("pitcher");
        if (error) {
          loadFavoritePitchersLocal();
          updateLookupFavoriteButton();
          return;
        }
        favoritePitcherNames = normalizeFavoritePitcherNames((data || []).map((row) => row.pitcher));
        rebuildFavoritePitcherKeys();
        persistFavoritePitchersLocal();
        updateLookupFavoriteButton();
      }

      function formatNumber(value, digits = 2) {
        if (typeof value === "string" && !value.trim()) return "";
        if (value === null || value === undefined || Number.isNaN(Number(value))) return "";
        return Number(value).toFixed(digits);
      }

      function displayProjectionValue(game) {
        const keys = ["projected_strikeouts", "adjusted_EK_full", "adjusted_EK_hand", "ensemble_prediction"];
        for (const key of keys) {
          if (!(key in game)) continue;
          const value = game[key];
          if (typeof value === "string" && !value.trim()) continue;
          if (value === null || value === undefined || Number.isNaN(Number(value))) continue;
          return Number(value);
        }
        return null;
      }

      function sortableGameDate(game) {
        const parsed = Date.parse(game?.sort_datetime || game?.game_date_raw || game?.start_time || game?.date || "");
        return Number.isNaN(parsed) ? Number.POSITIVE_INFINITY : parsed;
      }

      function parseGameStartDate(game) {
        const candidates = [
          game?.sort_datetime,
          game?.start_time,
          game?.game_date_raw,
          [game?.date, game?.time].filter(Boolean).join(" "),
          game?.date,
        ].filter((value) => String(value || "").trim());
        for (const value of candidates) {
          const parsed = new Date(value);
          if (!Number.isNaN(parsed.getTime())) return parsed;
        }
        return null;
      }

      function formatGameDateTime(game) {
        const start = parseGameStartDate(game);
        if (!start) {
          const date = String(game?.date || "").trim();
          const time = String(game?.time || "").trim();
          return [date, time].filter(Boolean).join(" ") || "TBD";
        }
        const datePart = start.toLocaleDateString([], { weekday: "short", month: "numeric", day: "numeric" });
        const timePart = start.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase();
        return `${datePart} · ${timePart}`;
      }

      function isClearlyCompletedGame(game) {
        const status = normalizeText(game?.game_status || game?.status || game?.abstract_game_state);
        return status.includes("final") || status.includes("completed") || status.includes("game over");
      }

      function isClearlyLiveGame(game) {
        const status = normalizeText(game?.game_status || game?.status || game?.abstract_game_state);
        return status.includes("live") || status.includes("in progress") || status.includes("middle") || status.includes("top ") || status.includes("bottom ");
      }

      function hasLiveGameSignals(game) {
        const inning = normalizeText(game?.game_inning || game?.inning || game?.inning_state);
        const liveKs = game?.live_strikeouts ?? game?.live_ks ?? game?.starter_strikeouts;
        return Boolean(inning || (liveKs !== null && liveKs !== undefined && String(liveKs).trim() !== ""));
      }

      function isClearlyUpcomingGame(game) {
        const status = normalizeText(game?.game_status || game?.status || game?.abstract_game_state);
        return status.includes("pre-game") || status.includes("scheduled") || status.includes("preview");
      }

      function shouldShowAsLiveGame(game, tableType) {
        if (isClearlyCompletedGame(game)) return false;
        if (isClearlyLiveGame(game) || tableType === "live") return true;
        if (hasLiveGameSignals(game)) return true;
        const startDate = parseGameStartDate(game);
        if (!startDate) return false;
        const minutesSinceStart = (Date.now() - startDate.getTime()) / 60000;
        return minutesSinceStart >= 0 && minutesSinceStart <= LIVE_GAME_MAX_MINUTES;
      }

      function splitSupabaseGameRows(rows) {
        const upcomingByKey = new Map();
        const liveByKey = new Map();
        const sortedRows = [...rows].sort((left, right) => {
          const leftIsLive = String(left?.table_type || "").toLowerCase() === "live" ? 1 : 0;
          const rightIsLive = String(right?.table_type || "").toLowerCase() === "live" ? 1 : 0;
          return leftIsLive - rightIsLive;
        });
        sortedRows.forEach((row) => {
          if (!row?.payload) return;
          const tableType = String(row.table_type || "").toLowerCase();
          const game = { ...row.payload };
          game._pitchiq_source_table = tableType === "live" ? "live" : "upcoming";
          const rowKey = [game.event_key, game.pitcher, game.opponent, game.date || game.game_date, game.start_time]
            .map((value) => normalizeText(value))
            .join("|");
          if (shouldShowAsLiveGame(game, tableType)) {
            if (!game.game_status || isClearlyUpcomingGame(game)) game.game_status = "In Progress";
            liveByKey.set(rowKey, game);
            upcomingByKey.delete(rowKey);
            return;
          }
          if ((tableType === "upcoming" || !isClearlyCompletedGame(game)) && !liveByKey.has(rowKey)) {
            upcomingByKey.set(rowKey, game);
          }
        });
        return {
          upcoming: Array.from(upcomingByKey.values()).sort((a, b) => sortableGameDate(a) - sortableGameDate(b)),
          live: Array.from(liveByKey.values()).sort((a, b) => sortableGameDate(a) - sortableGameDate(b)),
        };
      }

      function gameBoardCacheKey(userId = currentUserId) {
        return userId ? `pitchiq.gameBoardCache.${userId}` : "pitchiq.gameBoardCache";
      }

      function loadCachedGameBoardSnapshot() {
        try {
          const raw = window.localStorage.getItem(gameBoardCacheKey());
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || Date.now() - Number(parsed.cachedAt || 0) > GAME_BOARD_CACHE_TTL_MS) return null;
          return {
            upcoming: Array.isArray(parsed.upcoming) ? parsed.upcoming : [],
            live: Array.isArray(parsed.live) ? parsed.live : [],
          };
        } catch {
          return null;
        }
      }

      function isPastScheduledDate(game) {
        if (shouldShowAsLiveGame(game, game?._pitchiq_source_table || "")) return false;
        const parsed = Date.parse(game?.sort_datetime || game?.game_date_raw || game?.date || "");
        if (Number.isNaN(parsed)) return false;
        const gameDate = new Date(parsed);
        const today = new Date();
        gameDate.setHours(0, 0, 0, 0);
        today.setHours(0, 0, 0, 0);
        return gameDate < today;
      }

      function refreshPitcherList() {
        const names = new Set();
        [...upcomingGames, ...liveGames, ...gameHistory].forEach((game) => {
          if (game?.pitcher) names.add(String(game.pitcher).trim());
        });
        lookupPitcherNames.forEach((name) => {
          if (name) names.add(String(name).trim());
        });
        allPitchers = Array.from(names).filter(Boolean).sort((a, b) => a.localeCompare(b));
      }

      function latestHistoricalGameForPitcher(pitcherName) {
        const normalizedPitcher = normalizeText(pitcherName);
        return gameHistory
          .filter((game) => normalizeText(game.pitcher) === normalizedPitcher)
          .sort((left, right) => sortableGameDate(right) - sortableGameDate(left))[0] || null;
      }

      async function loadHistoricalRows() {
        const { data: historyRows, error } = await supabaseClient
          .from("pitchiq_historical_rows")
          .select("event_key,pitcher,game_date,payload,updated_at")
          .order("updated_at", { ascending: false })
          .limit(2000);

        if (error) {
          gameHistory = [];
          return;
        }

        gameHistory = (historyRows || [])
          .filter((row) => row.payload)
          .map((row) => ({
            ...row.payload,
            event_key: row.payload.event_key || row.event_key || "",
            pitcher: row.payload.pitcher || row.pitcher || "",
            game_date: row.payload.game_date || row.payload.date || row.game_date || "",
            _pitchiq_source_table: "historical",
          }));

        gameHistory.sort((left, right) => sortableGameDate(right) - sortableGameDate(left));
      }

      async function loadLookupPitcherNames() {
        lookupPitcherNames = [];
        const pageSize = 1000;
        let from = 0;

        while (true) {
          const { data, error } = await supabaseClient
            .from("pitchiq_pitcher_lookup")
            .select("pitcher")
            .order("pitcher", { ascending: true })
            .range(from, from + pageSize - 1);

          if (error || !data?.length) break;

          lookupPitcherNames.push(...data.map((row) => row.pitcher).filter(Boolean));
          if (data.length < pageSize) break;
          from += pageSize;
        }
      }

      function isAssignedUmp(value) {
        const normalized = normalizeText(value);
        return Boolean(normalized && !["pending", "unknown", "n/a", "na"].includes(normalized));
      }

      function isAssignedLineup(game) {
        return Boolean(game?.opponent_lineup_assigned);
      }

      function formatUmpire(value) {
        const umpire = String(value || "").trim();
        return isAssignedUmp(umpire) ? umpire : "Pending";
      }

      function formatTeamLineupLabel(teamName) {
        const text = String(teamName || "").trim();
        if (!text) return "Opponent";
        const parts = text.split(/\s+/);
        if (parts.length === 1) return parts[0];
        const lastTwo = parts.slice(-2).join(" ");
        if (lastTwo === "Red Sox" || lastTwo === "White Sox" || lastTwo === "Blue Jays") return lastTwo;
        return parts[parts.length - 1];
      }

      function formatEdge(value) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) return "—";
        const number = Number(value);
        return `${number >= 0 ? "+" : ""}${number.toFixed(2)}`;
      }

      function formatBet(value) {
        const normalized = String(value || "").trim().toUpperCase();
        if (!normalized || normalized === "PASS" || normalized === "AVOID") return "Avoid";
        return normalized.charAt(0) + normalized.slice(1).toLowerCase();
      }

      function liveStrikeoutValue(game) {
        const value = game?.live_strikeouts ?? game?.live_ks ?? game?.starter_strikeouts;
        if (value === null || value === undefined || value === "") return "";
        const numeric = Number(value);
        return Number.isFinite(numeric) ? String(Math.trunc(numeric)) : String(value).trim();
      }

      function formatVolatility(game) {
        const label = String(game?.volatility_label || "").trim();
        const score = game?.volatility_score;
        if (!label || score === null || score === undefined || score === "" || Number.isNaN(Number(score))) return "";
        return `${label} · ${formatNumber(score, 2)}`;
      }

      function formatBetClass(value) {
        const normalized = String(value || "").trim().toUpperCase();
        if (normalized === "OVER") return "is-over";
        if (normalized === "UNDER") return "is-under";
        return "is-avoid";
      }

      function edgeToneClass(value, bet) {
        const betNorm = String(bet || "").trim().toUpperCase();
        if (betNorm === "PASS" || betNorm === "AVOID") return "neutral";
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) return "neutral";
        return Number(value) >= 0 ? "positive" : "negative";
      }

      function formatTeamShort(teamName, fallback) {
        const text = String(teamName || "").trim();
        if (!text) return fallback;
        const parts = text.split(/\s+/);
        if (parts.length === 1) return parts[0];
        const lastTwo = parts.slice(-2).join(" ");
        if (lastTwo === "Red Sox" || lastTwo === "White Sox" || lastTwo === "Blue Jays") return lastTwo;
        return parts[parts.length - 1];
      }

      function formatLiveInningStatus(game) {
        return String(game?.game_inning || game?.starter_status || "").trim();
      }

      function renderMatchupDateTime(game, isLive) {
        if (!isLive) {
          return escapeHtml(formatGameDateTime(game));
        }
        const inning = formatLiveInningStatus(game);
        if (!inning) {
          return '<span class="matchup-live-label">Live</span>';
        }
        return `<span class="matchup-live-label">Live</span><span class="matchup-live-sep"> - </span><span class="matchup-live-status">${escapeHtml(inning)}</span>`;
      }

      function formatHomeAwayLabel(value) {
        const normalized = normalizeText(value);
        if (normalized === "home") return "Home";
        if (normalized === "away") return "Away";
        return String(value || "").trim();
      }

      function buildMatchupColumns(game) {
        const homeAway = formatHomeAwayLabel(game?.home_or_away);
        const venue = String(game?.venue || "").trim();
        const isPitcherHome = normalizeText(game?.home_or_away) === "home";

        const pitcherSubs = homeAway ? [homeAway] : [];
        const opponentSubs = [];

        if (venue) {
          if (isPitcherHome) pitcherSubs.push(venue);
          else if (normalizeText(game?.home_or_away) === "away") opponentSubs.push(venue);
        }

        return { pitcherSubs, opponentSubs };
      }

      function renderMatchupSubLines(subs) {
        return subs.map((line) => `<span class="matchup-sub">${escapeHtml(line)}</span>`).join("");
      }

      function renderProjectionRow(projectedText) {
        return `
          <div class="book-row is-pitchiq">
            <div class="book-row-head">
              <span class="book-name">PitchIQ K</span>
              <span class="book-line">${escapeHtml(projectedText)}</span>
            </div>
          </div>
        `;
      }

      function renderBookRow(label, cssClass, line, bet, edge) {
        const lineText = String(line || "").trim() || "—";
        const betText = formatBet(bet);
        return `
          <div class="book-row ${cssClass}">
            <div class="book-row-head">
              <span class="book-name">${escapeHtml(label)}</span>
              <span class="book-line">${escapeHtml(lineText)}</span>
            </div>
            <div class="book-row-foot">
              <span class="book-bet ${formatBetClass(bet)}">${escapeHtml(betText)}</span>
              <span class="book-edge ${edgeToneClass(edge, bet)}">${escapeHtml(formatEdge(edge))}</span>
            </div>
          </div>
        `;
      }

      function renderStatPill(label, value, options = {}) {
        const classes = ["stat-pill", options.className || ""];
        if (options.assigned === true) classes.push("is-assigned");
        if (options.assigned === false) classes.push("is-pending");
        if (options.span2) classes.push("span-2");
        return `
          <div class="${classes.filter(Boolean).join(" ")}">
            <span class="label">${escapeHtml(label)}</span>
            <span class="value">${escapeHtml(value)}</span>
          </div>
        `;
      }

      function parseValidLine(value) {
        const normalized = String(value ?? "").trim().toLowerCase();
        if (!normalized || ["-", "pending", "unknown", "n/a", "na"].includes(normalized)) return null;
        const line = Number(value);
        return Number.isFinite(line) && line > 0 ? line : null;
      }

      function lineDiscrepancyNote(game) {
        const dkLine = parseValidLine(game?.dk_line);
        const fdLine = parseValidLine(game?.fd_line);
        if (dkLine === null || fdLine === null || dkLine === fdLine) return "";
        const projected = displayProjectionValue(game);
        if (!Number.isFinite(Number(projected))) return "";

        if (Number(projected) < Math.min(dkLine, fdLine)) {
          return dkLine > fdLine ? "+DK O/U Line" : "+FD O/U Line";
        }
        if (Number(projected) > Math.max(dkLine, fdLine)) {
          return dkLine < fdLine ? "+DK O/U Line" : "+FD O/U Line";
        }
        return "";
      }

      function normalizeLineNoteKey(value) {
        const normalized = normalizeText(value);
        if (normalized === "+dk line" || normalized === "+dk o/u line") return "+dk o/u line";
        if (normalized === "+fd line" || normalized === "+fd o/u line") return "+fd o/u line";
        return normalized;
      }

      function upgradeLineNoteLabels(notesText) {
        return String(notesText || "")
          .replace(/\+DK Line\b/g, "+DK O/U Line")
          .replace(/\+FD Line\b/g, "+FD O/U Line");
      }

      function cleanLineNotes(game, notes) {
        const validLineNote = normalizeLineNoteKey(lineDiscrepancyNote(game));
        return upgradeLineNoteLabels(String(notes || "")
          .split(/\s*(?:,|\|)\s*/)
          .map((note) => note.trim())
          .filter(Boolean)
          .filter((note) => {
            const normalized = normalizeLineNoteKey(note);
            if (normalized === "+dk o/u line" || normalized === "+fd o/u line") return normalized === validLineNote;
            return true;
          })
          .join(", "));
      }

      function displayNotesText(game) {
        const rawNotes = cleanLineNotes(game, game?.notes);
        const discrepancyNote = lineDiscrepancyNote(game);
        const hasDiscrepancyNote = String(rawNotes || "")
          .split(/\s*(?:,|\|)\s*/)
          .map((note) => normalizeLineNoteKey(note.trim()))
          .includes(normalizeLineNoteKey(discrepancyNote));
        if (!discrepancyNote || hasDiscrepancyNote) {
          return rawNotes;
        }
        return [discrepancyNote, rawNotes].filter(Boolean).join(" | ");
      }

      function dedupeNotes(notes) {
        const seen = new Set();
        return (Array.isArray(notes) ? notes : []).filter((note) => {
          const key = [
            normalizeText(note?.title),
            normalizeText(note?.body),
            normalizeText(note?.impact),
          ].join("|");
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function noteImpactSuffix(impact) {
        if (impact === "up") return { text: "+K", className: "" };
        if (impact === "down") return { text: "-K", className: "down" };
        return { text: "", className: "" };
      }

      function sanitizeNoteHtml(value, title = "") {
        let html = escapeHtml(value)
          .replace(/&lt;strong&gt;/gi, "<strong>")
          .replace(/&lt;\/strong&gt;/gi, "</strong>");
        const dkToken = "__NOTE_BOOK_DK__";
        const fdToken = "__NOTE_BOOK_FD__";
        html = html
          .replace(/<strong>DraftKings<\/strong>/g, dkToken)
          .replace(/<strong>FanDuel<\/strong>/g, fdToken)
          .replace(/\bDraftKings\b/g, dkToken)
          .replace(/\bFanDuel\b/g, fdToken)
          .replace(new RegExp(dkToken, "g"), '<strong class="note-book-dk">DraftKings</strong>')
          .replace(new RegExp(fdToken, "g"), '<strong class="note-book-fd">FanDuel</strong>');
        if (normalizeText(title).includes("umpire")) {
          html = html.replace(/^([A-Z][^<.]*?)(?= (?:has|is) )/, (match) => {
            if (normalizeText(match).startsWith("the ")) return match;
            return `<strong>${match}</strong>`;
          });
        }
        return html;
      }

      function notesFromGame(game) {
        if (Array.isArray(game.upcoming_notes) && game.upcoming_notes.length) {
          return dedupeNotes(game.upcoming_notes);
        }

        const notes = [];
        const projected = displayProjectionValue(game);
        const bestEdge = Math.max(Number(game.dk_edge) || 0, Number(game.fd_edge) || 0);
        if (bestEdge >= 1) {
          notes.push({
            impact: "up",
            title: "Edge Showing",
            body: `The board is showing at least a +${formatNumber(bestEdge, 2)} edge against one available sportsbook line.`,
          });
        }
        if (isAssignedUmp(game.plate_umpire)) {
          notes.push({
            impact: "neutral",
            title: "Umpire Assigned",
            body: `${game.plate_umpire} is listed behind the plate for this matchup.`,
          });
        }
        if (isAssignedLineup(game)) {
          notes.push({
            impact: "neutral",
            title: "Opponent Lineup Announced",
            body: `${game.opponent || "The opponent"} has posted its starting batting order for tonight.`,
          });
        }
        if (game.weather || game.wind) {
          notes.push({
            impact: "neutral",
            title: "Game Context",
            body: [game.weather, game.temperature ? `${game.temperature}F` : "", game.wind].filter(Boolean).join(", "),
          });
        }
        const displayNotes = displayNotesText(game);
        if (!notes.length && displayNotes) {
          notes.push({ impact: "neutral", title: "Notes", body: displayNotes });
        }
        if (!notes.length && Number.isFinite(Number(projected))) {
          notes.push({
            impact: "neutral",
            title: "Projection Ready",
            body: `${game.pitcher} is projected for ${formatNumber(projected, 2)} strikeouts.`,
          });
        }
        return notes;
      }

      function renderNotes(notes) {
        notes = dedupeNotes(notes);
        if (!notes.length) {
          return `
            <div class="note-card neutral">
              <div class="note-title">No Major Flags</div>
              <div class="note-body">No strong context edges are standing out for the upcoming projection yet.</div>
            </div>
          `;
        }
        return notes.map((note) => {
          const suffix = noteImpactSuffix(note.impact);
          return `
            <div class="note-card ${escapeHtml(note.impact || "neutral")}">
              <div class="note-title">
                ${escapeHtml(note.title || "")}
                ${suffix.text ? `<span class="note-k ${suffix.className}">${suffix.text}</span>` : ""}
              </div>
              <div class="note-body">${sanitizeNoteHtml(note.body || "", note.title || "")}</div>
            </div>
          `;
        }).join("");
      }

      function renderLookupGame(game) {
        const projected = displayProjectionValue(game);
        const projectedText = projected === null ? "—" : formatNumber(projected);
        const isLive = shouldShowAsLiveGame(game, game?._pitchiq_source_table || "");
        const umpAssigned = isAssignedUmp(game?.plate_umpire);
        const lineupAssigned = isAssignedLineup(game);
        const lineupLabel = `${formatTeamLineupLabel(game?.opponent)} Lineup`;
        const liveK = liveStrikeoutValue(game);
        const vix = formatVolatility(game);
        const matchupColumns = buildMatchupColumns(game);
        const pitcherTeam = formatTeamShort(game?.pitcher_team, "Team TBD");
        const opponentTeam = formatTeamShort(game?.opponent, "TBD");

        const contextStats = [];
        if (isLive && liveK) {
          contextStats.push(renderStatPill("Current Ks", liveK, { className: "is-live" }));
        }
        if (isLive && game?.live_pitch_count !== null && game?.live_pitch_count !== undefined && String(game.live_pitch_count).trim() !== "") {
          contextStats.push(renderStatPill("Pitch Count", String(Math.trunc(Number(game.live_pitch_count)))));
        }
        contextStats.push(renderStatPill("Plate Ump", formatUmpire(game?.plate_umpire), { assigned: umpAssigned }));
        if (vix) {
          contextStats.push(renderStatPill("Vix", vix, { className: "is-vix" }));
        }
        if (!isLive) {
          contextStats.push(renderStatPill(lineupLabel, lineupAssigned ? "Announced" : "Pending", { assigned: lineupAssigned }));
        }

        lookupPanel.innerHTML = `
          <section class="result-block is-matchup${isLive ? " is-live" : ""}">
            <h3 class="result-block-title">Next Matchup</h3>
            <p class="matchup-datetime${isLive ? " is-live" : ""}">${renderMatchupDateTime(game, isLive)}</p>
            <div class="matchup-strip">
              <div class="matchup-col pitcher">
                <span class="matchup-team">${escapeHtml(pitcherTeam)}</span>
                ${renderMatchupSubLines(matchupColumns.pitcherSubs)}
              </div>
              <span class="matchup-vs">vs</span>
              <div class="matchup-col opponent">
                <span class="matchup-team">${escapeHtml(opponentTeam)}</span>
                ${renderMatchupSubLines(matchupColumns.opponentSubs)}
              </div>
            </div>
          </section>

          <section class="result-block">
            <h3 class="result-block-title">Projection/Lines</h3>
            <div class="book-rows">
              ${renderProjectionRow(projectedText)}
              ${renderBookRow("DraftKings", "is-dk", game?.dk_line, game?.dk_bet, game?.dk_edge)}
              ${renderBookRow("FanDuel", "is-fd", game?.fd_line, game?.fd_bet, game?.fd_edge)}
            </div>
          </section>

          ${contextStats.length ? `
          <section class="result-block">
            <h3 class="result-block-title">Context</h3>
            <div class="stat-grid">${contextStats.join("")}</div>
          </section>
          ` : ""}

          <section class="result-block">
            <h3 class="result-block-title">Notes</h3>
            <div class="note-list">${renderNotes(notesFromGame(game))}</div>
          </section>
        `;
      }

      function renderEmptyLookup() {
        lookupPanel.innerHTML = `
          <div class="lookup-empty">
            <p class="lookup-empty-title">Find a pitcher</p>
            <p class="lookup-empty-body">Search any arm on the slate to see PitchIQ K, sportsbook lines, matchup context, and notes in one place.</p>
          </div>
        `;
      }

      function renderNotScheduledLookup(pitcherName, latestHistory = null) {
        const lastGameK = latestHistory?.actual_k ?? latestHistory?.strikeouts ?? latestHistory?.live_strikeouts ?? "";
        const lastGameMeta = latestHistory
          ? [latestHistory.date || latestHistory.game_date, latestHistory.opponent].filter(Boolean).join(" vs ")
          : "";
        lookupPanel.innerHTML = `
          ${lastGameK || lastGameMeta ? `
          <section class="result-block">
            <h3 class="result-block-title">Recent History</h3>
            <div class="stat-grid">
              ${lastGameMeta ? renderStatPill("Last Start", lastGameMeta, { span2: true }) : ""}
              ${lastGameK !== "" && lastGameK !== null && lastGameK !== undefined ? renderStatPill("Last Game K", String(lastGameK)) : ""}
            </div>
          </section>
          ` : ""}
          <section class="result-block">
            <h3 class="result-block-title">Notes</h3>
            <div class="note-list">
              <div class="note-card neutral">
                <div class="note-title">Not Scheduled</div>
                <div class="note-body">${escapeHtml(pitcherName)} does not have a probable-starter game on the current slate.</div>
              </div>
            </div>
          </section>
        `;
      }

      function currentPitcherGame(pitcherName) {
        const normalizedPitcher = normalizeText(pitcherName);
        return [...upcomingGames, ...liveGames]
          .find((game) => normalizeText(game.pitcher) === normalizedPitcher && !isPastScheduledDate(game)) || null;
      }

      function resolvePitcherName() {
        const raw = (pitcherInput.value || "").trim();
        if (!raw) return "";
        const exact = allPitchers.find((name) => name.toLowerCase() === raw.toLowerCase());
        if (exact) return exact;
        const startsWith = allPitchers.find((name) => name.toLowerCase().startsWith(raw.toLowerCase()));
        if (startsWith) {
          pitcherInput.value = startsWith;
          return startsWith;
        }
        const contains = allPitchers.find((name) => name.toLowerCase().includes(raw.toLowerCase()));
        if (contains) {
          pitcherInput.value = contains;
          return contains;
        }
        return raw;
      }

      function projectPitcher() {
        if (!dataReady) return;
        const pitcherName = resolvePitcherName();
        updatePitcherClearButton();
        closePitcherDropdown();
        if (!pitcherName) {
          renderEmptyLookup();
          updateLookupFavoriteButton();
          return;
        }
        const match = currentPitcherGame(pitcherName);
        if (!match) {
          renderNotScheduledLookup(pitcherName, latestHistoricalGameForPitcher(pitcherName));
        } else {
          renderLookupGame(match);
        }
        updateLookupFavoriteButton();
        const url = new URL(window.location.href);
        url.searchParams.set("pitcher", pitcherName);
        history.replaceState(null, "", url);
      }

      function filterPitchers(query) {
        const trimmed = (query || "").trim().toLowerCase();
        if (!trimmed) return allPitchers.slice(0, 100);
        const startsWith = allPitchers.filter((name) => name.toLowerCase().startsWith(trimmed));
        const contains = allPitchers.filter((name) => !startsWith.includes(name) && name.toLowerCase().includes(trimmed));
        return [...startsWith, ...contains].slice(0, 100);
      }

      function renderPitcherDropdown() {
        filteredPitchers = filterPitchers(pitcherInput.value);
        if (!filteredPitchers.length) {
          pitcherDropdown.innerHTML = '<div class="search-empty">No matching pitchers</div>';
          activePitcherIndex = -1;
        } else {
          pitcherDropdown.innerHTML = filteredPitchers.map((name, index) => `
            <div class="search-option ${index === activePitcherIndex ? "active" : ""}" data-name="${escapeHtml(name)}">${escapeHtml(name)}</div>
          `).join("");
        }
      }

      function openPitcherDropdown() {
        if (!dataReady) return;
        renderPitcherDropdown();
        pitcherDropdown.classList.remove("hidden");
      }

      function closePitcherDropdown() {
        pitcherDropdown.classList.add("hidden");
        activePitcherIndex = -1;
      }

      function selectPitcher(name) {
        pitcherInput.value = name;
        updatePitcherClearButton();
        closePitcherDropdown();
        projectPitcher();
      }

      function updatePitcherClearButton() {
        clearPitcherButton.classList.toggle("hidden", !pitcherInput.value);
      }

      function syncHeaderSpacer() {
        if (!header || !headerSpacer) return;
        const height = Math.ceil(header.getBoundingClientRect().height);
        headerSpacer.style.height = `${height}px`;
        document.documentElement.style.setProperty("--mobile-header-height", `${height}px`);
      }

      function formatServerActivity(value) {
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return "";
        const part = (number) => String(number).padStart(2, "0");
        return `${part(parsed.getHours())}:${part(parsed.getMinutes())} ${part(parsed.getMonth() + 1)}:${part(parsed.getDate())}:${parsed.getFullYear()}`;
      }

      async function loadServerActivity() {
        const { data, error } = await supabaseClient
          .from("pitchiq_server_activity")
          .select("last_activity_at")
          .eq("id", "worker")
          .maybeSingle();
        const { data: gameRows } = await supabaseClient
          .from("pitchiq_game_rows")
          .select("updated_at")
          .order("updated_at", { ascending: false })
          .limit(1);
        const latest = [error ? null : data?.last_activity_at, gameRows?.[0]?.updated_at]
          .filter(Boolean)
          .map((value) => new Date(value))
          .filter((value) => !Number.isNaN(value.getTime()))
          .sort((a, b) => b.getTime() - a.getTime())[0];
        serverActivityFooter.textContent = `last server activity: ${formatServerActivity(latest) || "pending"}`;
      }

      async function loadSupabaseTables() {
        const [gameRowsResult] = await Promise.all([
          supabaseClient
            .from("pitchiq_game_rows")
            .select("table_type,payload,updated_at")
            .order("updated_at", { ascending: false }),
          loadHistoricalRows(),
          loadLookupPitcherNames(),
        ]);
        const { data: gameRows, error } = gameRowsResult;

        if (error) {
          refreshPitcherList();
          dataReady = true;
          lookupLoading?.remove();
          renderEmptyLookup();
          return;
        }

        const splitGames = splitSupabaseGameRows(gameRows || []);
        if ((gameRows || []).length) {
          upcomingGames = splitGames.upcoming;
          liveGames = splitGames.live;
        } else {
          const cached = loadCachedGameBoardSnapshot();
          upcomingGames = cached?.upcoming || [];
          liveGames = cached?.live || [];
        }
        refreshPitcherList();
        dataReady = true;
        lookupLoading?.remove();
        projectPitcher();
      }

      function setNavOpen(open) {
        navToggle.setAttribute("aria-expanded", open ? "true" : "false");
        navDropdown.classList.toggle("hidden", !open);
      }

      async function getUserProfile(userId) {
        return window.PitchIQBilling.fetchBillingProfile(supabaseClient, userId);
      }

      function isOwnerRole(role) {
        return String(role || "").trim().toLowerCase() === "owner";
      }

      function setOwnerPortalLink(role) {
        const link = document.getElementById("owner-portal-link");
        if (!link) return;
        link.hidden = !isOwnerRole(role);
      }

      async function openOwnersPortal(event) {
        event.preventDefault();
        event.stopPropagation();
        setNavOpen(false);
        if (!isOwnerRole(currentUserRole)) {
          setOwnerPortalLink(currentUserRole);
          return;
        }
        try {
          const { data, error: sessionError } = await supabaseClient.auth.getSession();
          const session = data?.session;
          if (sessionError || !session?.user?.id) {
            redirectToLogin();
            return;
          }
          const { profile, error } = await getUserProfile(session.user.id);
          const role = profile?.role || null;
          currentUserRole = role;
          setOwnerPortalLink(role);
          if (error || !isOwnerRole(role)) {
            window.alert("Owner access only.");
            return;
          }
          window.location.assign("./owners/mobile.html");
        } catch (err) {
          console.error(err);
          window.alert("Could not verify owner access. Try again.");
        }
      }

      function setAccountIdentity(session, role = currentUserRole) {
        const user = session?.user;
        const username = user?.user_metadata?.username;
        const identityLabel = String(username || user?.email || "Unknown user").trim();
        const normalizedRole = ALLOWED_ACCOUNT_ROLES.includes(role) ? role : "";
        accountPill.innerHTML = `Welcome, <span class="account-username tier-value-${escapeHtml(normalizedRole)}">${escapeHtml(identityLabel)}</span>`;
        setOwnerPortalLink(normalizedRole);
      }

      function redirectToLogin() {
        if (authAccepted || authRedirected) return;
        authRedirected = true;
        window.location.replace("./login.html");
      }

      async function acceptSession(session) {
        if (!session || authAccepted || authRedirected) return;
        const checkId = ++authCheckId;
        const { profile, error } = await getUserProfile(session.user.id);
        if (checkId !== authCheckId || authAccepted || authRedirected) return;
        if (error) {
          window.clearTimeout(authTimeout);
          redirectToLogin();
          return;
        }
        const role = profile?.role || null;
        if (!window.PitchIQBilling.hasActiveMembership(profile)) {
          window.clearTimeout(authTimeout);
          window.location.replace("./subscribe.html");
          return;
        }
        if (!ALLOWED_ACCOUNT_ROLES.includes(role)) {
          await supabaseClient.auth.signOut();
          redirectToLogin();
          return;
        }
        authAccepted = true;
        currentUserId = session.user.id;
        currentUserRole = role;
        setAccountIdentity(session, role);
        setOwnerPortalLink(role);
        await Promise.all([loadSupabaseTables(), loadServerActivity(), loadFavoritePitchers()]);
        requestAnimationFrame(syncHeaderSpacer);
      }

      const authTimeout = window.setTimeout(redirectToLogin, 8000);

      pitcherInput.addEventListener("input", () => {
        updatePitcherClearButton();
        openPitcherDropdown();
      });

      pitcherInput.addEventListener("focus", openPitcherDropdown);

      pitcherInput.addEventListener("keydown", (event) => {
        if (pitcherDropdown.classList.contains("hidden")) {
          if (event.key === "Enter") {
            event.preventDefault();
            projectPitcher();
          }
          return;
        }
        if (event.key === "ArrowDown") {
          event.preventDefault();
          activePitcherIndex = Math.min(activePitcherIndex + 1, filteredPitchers.length - 1);
          renderPitcherDropdown();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          activePitcherIndex = Math.max(activePitcherIndex - 1, 0);
          renderPitcherDropdown();
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (activePitcherIndex >= 0 && filteredPitchers[activePitcherIndex]) {
            selectPitcher(filteredPitchers[activePitcherIndex]);
          } else {
            projectPitcher();
          }
        } else if (event.key === "Escape") {
          if (!pitchiqConfirmModal.classList.contains("hidden")) {
            closePitchiqConfirm(false);
            return;
          }
          closePitcherDropdown();
        }
      });

      pitcherDropdown.addEventListener("mousedown", (event) => {
        const option = event.target.closest(".search-option");
        if (!option?.dataset.name) return;
        event.preventDefault();
        selectPitcher(option.dataset.name);
      });

      clearPitcherButton.addEventListener("click", () => {
        pitcherInput.value = "";
        updatePitcherClearButton();
        updateLookupFavoriteButton();
        closePitcherDropdown();
        renderEmptyLookup();
        const url = new URL(window.location.href);
        url.searchParams.delete("pitcher");
        history.replaceState(null, "", url);
        pitcherInput.blur();
      });

      lookupFavoriteBtn?.addEventListener("click", () => {
        if (!canViewMyPitchers()) {
          window.location.href = "./app-mobile-pitchers.html";
          return;
        }
        const pitcherName = resolvePitcherName();
        if (!pitcherName) return;
        void toggleFavoritePitcher(pitcherName);
      });

      pitchiqConfirmCancel.addEventListener("click", () => closePitchiqConfirm(false));
      pitchiqConfirmProceed.addEventListener("click", () => {
        if (performance.now() - pitchiqConfirmOpenedAt < 300) return;
        closePitchiqConfirm(true);
      });
      pitchiqConfirmModal.addEventListener("click", (event) => {
        if (event.target === pitchiqConfirmModal) closePitchiqConfirm(false);
      });

      navToggle?.addEventListener("click", (event) => {
        event.stopPropagation();
        const open = navToggle.getAttribute("aria-expanded") === "true";
        setNavOpen(!open);
      });

      document.getElementById("owner-portal-link")?.addEventListener("click", (event) => {
        openOwnersPortal(event);
      });

      navDropdown?.addEventListener("click", (event) => {
        if (event.target?.closest?.("#owner-portal-link")) return;
        setNavOpen(false);
      });

      document.addEventListener("click", (event) => {
        if (!navMenu?.contains(event.target)) setNavOpen(false);
        if (!event.target.closest(".search-shell")) closePitcherDropdown();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setNavOpen(false);
      });

      syncHeaderSpacer();
      if (header && typeof ResizeObserver !== "undefined") {
        new ResizeObserver(syncHeaderSpacer).observe(header);
      }
      window.addEventListener("resize", syncHeaderSpacer, { passive: true });

      const initialPitcher = new URLSearchParams(window.location.search).get("pitcher");
      if (initialPitcher) pitcherInput.value = initialPitcher;

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          window.clearTimeout(authTimeout);
          acceptSession(session);
          return;
        }
        if (event === "SIGNED_OUT" && !authAccepted) {
          window.clearTimeout(authTimeout);
          redirectToLogin();
        }
      });

      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (sessionData?.session) {
        window.clearTimeout(authTimeout);
        await acceptSession(sessionData.session);
      }
    })();
  </script>
<script data-goatcounter="https://tstowe0.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
