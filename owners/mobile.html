<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="PitchIQ Owners Portal — mobile." />
  <meta name="theme-color" content="#050505" />
  <title>PitchIQ Owners · Mobile</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.has("mobile")) return;
      if (window.matchMedia("(min-width: 761px)").matches) {
        window.location.replace("./index.html" + (window.location.search || ""));
      }
    })();
  </script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body data-shell="mobile">
  <div class="boot-banner hidden" id="boot-banner" role="alert"></div>

  <div class="mobile-shell app app--locked" id="app">
    <header class="mobile-topbar" id="mobile-topbar">
      <div class="mobile-topbar-brand">
        <img class="mobile-brand-mark" src="images/PitchIQ%20Logo.png" alt="" width="32" height="32" decoding="async" />
        <div class="mobile-brand-text">
          <p class="mobile-brand-name">Owners</p>
          <p class="mobile-view-title" id="mobile-view-title">Dashboard</p>
        </div>
      </div>
      <button
        class="mobile-menu-btn"
        id="mobile-menu-btn"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="app-sidebar"
      >
        <span class="mobile-menu-icon" aria-hidden="true"><span></span></span>
      </button>
    </header>

    <div class="mobile-drawer-backdrop hidden" id="mobile-drawer-backdrop" hidden></div>

    <aside class="sidebar mobile-drawer" id="app-sidebar" aria-hidden="true">
      <div class="mobile-drawer-head">
        <div class="brand">
          <img class="brand-logo" src="images/PitchIQ%20Logo.png" alt="PitchIQ" />
          <span class="brand-title">Owners Portal</span>
        </div>
        <button type="button" class="mobile-drawer-close" id="mobile-drawer-close" aria-label="Close navigation">
          ×
        </button>
      </div>
      <nav class="nav" id="main-nav" aria-label="Main"></nav>
      <div class="sidebar-filters" id="sidebar-filters" aria-label="Date filters">
        <p class="nav-heading">Filters</p>
        <div class="field">
          <label for="sidebar-filter-start">Start date</label>
          <input id="sidebar-filter-start" type="date" />
        </div>
        <div class="field">
          <label for="sidebar-filter-end">End date</label>
          <input id="sidebar-filter-end" type="date" />
        </div>
        <div class="sidebar-filter-actions">
          <button type="button" class="btn btn-primary" id="sidebar-filter-apply">Apply</button>
          <button type="button" class="btn btn-ghost" id="sidebar-filter-clear">Clear</button>
        </div>
        <p class="sidebar-filter-sample muted" id="sidebar-filter-sample"></p>
      </div>
      <div class="mobile-drawer-footer">
        <a class="mobile-back-link" href="../app-mobile.html">← Back to PitchIQ</a>
        <a class="mobile-back-link muted" href="./index.html?desktop=1">Desktop portal</a>
      </div>
    </aside>

    <div class="main-wrap mobile-main">
      <p class="mobile-status" id="status-text" aria-live="polite"></p>
      <input type="search" id="table-search" class="mobile-search-hidden" hidden aria-hidden="true" tabindex="-1" />

      <div class="content-workspace" id="content-workspace">
        <main class="content" id="main-content">
          <section class="welcome" id="welcome-panel" aria-label="Load PitchIQ historical data">
            <div class="welcome-copy">
              <p class="welcome-eyebrow">PitchIQ</p>
              <h1 class="welcome-title">Owners · Mobile</h1>
              <p class="welcome-body">Sign in with your owner account to load settled history. Excel upload remains available as a fallback.</p>
            </div>
            <form class="auth-card" id="auth-form">
              <div class="field">
                <label for="auth-email">Email</label>
                <input id="auth-email" type="email" autocomplete="username" required />
              </div>
              <div class="field">
                <label for="auth-password">Password</label>
                <input id="auth-password" type="password" autocomplete="current-password" required />
              </div>
              <button type="submit" class="btn btn-primary btn-lg welcome-cta" id="btn-signin-load">
                Sign in &amp; load Supabase
              </button>
              <p class="auth-status muted" id="auth-status" aria-live="polite"></p>
            </form>
            <div class="welcome-actions">
              <button type="button" class="btn btn-ghost" id="btn-load-supabase">
                Load with current session
              </button>
              <button type="button" class="btn btn-ghost" id="btn-upload-welcome">
                Upload Excel export
              </button>
            </div>
            <input type="file" id="file-input-welcome" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden />
          </section>
          <div class="view-root hidden" id="view-root"></div>
        </main>
      </div>
    </div>
  </div>

  <div class="loading-overlay hidden" id="loading-overlay" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <p id="loading-message">Working…</p>
      <p class="loading-detail" id="loading-detail"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
